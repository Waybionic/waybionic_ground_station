name: waybionic_robostack

channels:
  - conda-forge
  - robostack-jazzy
  - nodefaults

dependencies:
  - ros-jazzy-ros-base
  - ros-jazzy-rviz2
  - ros-jazzy-rviz-imu-plugin
  - ros-jazzy-xacro
  - ros-jazzy-joint-state-publisher-gui
  - colcon-common-extensions
  - compilers
  - cmake
  - pkg-config
  - make
  - ninja
  - pytest <9
  # colcon still relies on the legacy `develop` and `test` commands removed by
  # newer setuptools. Keep Python ROS packages editable and testable on macOS.
  - setuptools <72
