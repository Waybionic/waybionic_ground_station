name: waybionic_robostack

channels:
  - conda-forge
  - robostack-jazzy
  - nodefaults

dependencies:
  - ros-jazzy-ros-base
  - ros-jazzy-rmw-cyclonedds-cpp
  - ros-jazzy-rviz2
  - ros-jazzy-rviz-imu-plugin
  - ros-jazzy-xacro
  - ros-jazzy-joint-state-publisher-gui
  # A controller plugged into the Mac (joy_source:=device).
  - ros-jazzy-joy
  - colcon-common-extensions
  - compilers
  - cmake
  - pkg-config
  - make
  - ninja
  - pytest <9
  - python-can
  # The carrier's USB serial link to the real arm.
  - pyserial
  # colcon still relies on the legacy `develop` and `test` commands removed by
  # newer setuptools. Keep Python ROS packages editable and testable on macOS.
  - setuptools <72
