# No kinematics solver for the "arm" group, deliberately.
#
# KDL builds its solver by walking a serial chain from a group's base link to
# its tip. The 2026-09-05 export has no chain - all twelve parts parent to the
# assembly root - so srdf/waybionic.srdf defines the group as a joint list, and
# there is nothing for KDL to walk.
#
# Effect: joint-space planning works, Cartesian pose goals and the RViz
# interactive marker do not. Restoring IK needs a chain from mechanical, not a
# different solver - see docs/model_import_runbook.md.

# An empty mapping, not an empty file: demo.launch.py passes this straight
# through as the robot_description_kinematics parameter, and a comments-only
# file parses to None, which the launch system rejects.
{}
