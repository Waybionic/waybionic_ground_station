name: CAN Drives over vcan

on:
  push:
    branches: [ "main" ]
    paths: [ "waybionic_can/**", "waybionic_teleop/**", "docker/**", ".github/workflows/can_drives.yml" ]
  pull_request:
    paths: [ "waybionic_can/**", "waybionic_teleop/**", "docker/**", ".github/workflows/can_drives.yml" ]

permissions:
  contents: read

jobs:
  can-drives-vcan:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Create vcan0
        run: |
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)"
          sudo modprobe vcan
          sudo ip link add dev vcan0 type vcan
          sudo ip link set up vcan0

      - name: Build the Workspace Image
        run: docker build --progress plain --target build --tag waybionic-can-drives --file docker/Dockerfile .

      # The host network namespace holds vcan0.
      - name: Drive Simulated MKS Drives over vcan0
        run: >
          docker run --rm --network host --env WAYBIONIC_CAN_TEST=socketcan:vcan0
          waybionic-can-drives python3 -m pytest -v -p no:cacheprovider
          src/waybionic_ground_station/waybionic_teleop/test/test_can_drives.py

      # The binary skips its cases when vcan0 is missing, so a skip, or no passed tests at all,
      # fails the job. This googletest has no --gtest_fail_if_skipped: an unknown flag prints
      # the help and exits 0 without running anything.
      - name: Run the four-node vcan integration test
        run: |
          set -o pipefail
          docker run --rm --network host waybionic-can-drives \
            /waybionic_ws/build/waybionic_can/test_vcan_four_node | tee four_node.txt
          grep -Eq '^\[  PASSED  \] [1-9][0-9]* tests?\.' four_node.txt
          ! grep -q 'SKIPPED' four_node.txt
