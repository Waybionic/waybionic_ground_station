name: Firmware

on:
  push:
    branches: [ "main" ]
    paths: [ "firmware/**", "waybionic_can/arduino/**", ".github/workflows/firmware.yml" ]
  pull_request:
    paths: [ "firmware/**", "waybionic_can/arduino/**", ".github/workflows/firmware.yml" ]

permissions:
  contents: read

jobs:
  compile-tool-board:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Compile for the UNO R4 WiFi
        uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:renesas_uno:unor4wifi
          sketch-paths: |
            - firmware/tool_board
          libraries: |
            - name: AccelStepper

  compile-can-sketches:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [unor4wifi, minima]
        sketch:
          - single_drive_bringup
          - carrier_bridge
          - four_node_bench/gateway
          - four_node_bench/receiver

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install UNO R4 core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:renesas_uno

      - name: Compile ${{ matrix.sketch }} for ${{ matrix.board }}
        run: >
          arduino-cli compile
          --fqbn arduino:renesas_uno:${{ matrix.board }}
          --libraries waybionic_can/arduino/libraries
          waybionic_can/arduino/${{ matrix.sketch }}
