name: ROS 2 Jazzy Docker Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Test Docker Image
        run: docker build --progress=plain --target test --file docker/Dockerfile --tag waybionic-ground-station:ci .

  build-and-test-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Test Docker Image
        run: docker build --progress=plain --target test --file docker/Dockerfile --tag waybionic-ground-station:ci .
