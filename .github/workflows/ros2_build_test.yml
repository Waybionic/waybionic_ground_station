name: ROS 2 Jazzy Docker Compose Build and Test

on:
  push:
    branches: [ "main" ]
  # Every pull request, including ones stacked on another pull request's branch.
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/waybionic/waybionic_ground_station

jobs:
  # Pull requests build and test with a read-only token. These job names are the required
  # checks, so keep them.
  build-and-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Test with Docker Compose
        run: docker compose --progress plain build test

  build-and-test-arm64:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Test with Docker Compose
        run: docker compose --progress plain build test

  # Pushes to main build and test the same way, then push the tested image under this commit.
  publish-amd64:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Test with Docker Compose
        run: docker compose --progress plain build test

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested x86-64 image
        run: |
          docker tag "$IMAGE:jazzy" "$IMAGE:$GITHUB_SHA-amd64"
          docker push "$IMAGE:$GITHUB_SHA-amd64"

  publish-arm64:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Test with Docker Compose
        run: docker compose --progress plain build test

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested ARM64 image
        run: |
          docker tag "$IMAGE:jazzy" "$IMAGE:$GITHUB_SHA-arm64"
          docker push "$IMAGE:$GITHUB_SHA-arm64"

  publish-image:
    if: github.event_name == 'push'
    needs: [publish-amd64, publish-arm64]
    runs-on: ubuntu-24.04
    # One run at a time moves the shared tag, after checking that its commit is still newest.
    concurrency:
      group: publish-image
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish one image for both architectures
        run: |
          tags=(--tag "$IMAGE:${GITHUB_SHA::7}")
          # Runs can finish out of order: only the newest commit on main moves :jazzy.
          head=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
          if [ "$head" = "$GITHUB_SHA" ]; then
            tags+=(--tag "$IMAGE:jazzy")
          else
            echo "main has moved on to $head, so :jazzy stays where it is"
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE:$GITHUB_SHA-amd64" "$IMAGE:$GITHUB_SHA-arm64"
