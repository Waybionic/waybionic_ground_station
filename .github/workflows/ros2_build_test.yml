name: ROS 2 Jazzy Docker Compose Build and Test

on:
  push:
    branches: [ "main" ]
  # Every pull request, including ones stacked on another pull request's branch.
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/waybionic/waybionic_ground_station

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Test with Docker Compose
        run: docker compose --progress plain build test

      - name: Log in to the GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested x86-64 image
        if: github.event_name == 'push'
        run: |
          docker tag "$IMAGE:jazzy" "$IMAGE:jazzy-amd64"
          docker push "$IMAGE:jazzy-amd64"

  build-and-test-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Test with Docker Compose
        run: docker compose --progress plain build test

      - name: Log in to the GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested ARM64 image
        if: github.event_name == 'push'
        run: |
          docker tag "$IMAGE:jazzy" "$IMAGE:jazzy-arm64"
          docker push "$IMAGE:jazzy-arm64"

  publish-image:
    if: github.event_name == 'push'
    needs: [build-and-test, build-and-test-arm64]
    runs-on: ubuntu-24.04
    permissions:
      packages: write

    steps:
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish one image for both architectures
        run: >-
          docker buildx imagetools create
          --tag "$IMAGE:jazzy" --tag "$IMAGE:${GITHUB_SHA::7}"
          "$IMAGE:jazzy-amd64" "$IMAGE:jazzy-arm64"
