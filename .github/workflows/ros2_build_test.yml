name: ROS 2 Jazzy Docker Compose Build and Test

on:
  push:
    branches: [ "main" ]
  # Every pull request, including ones stacked on another pull request's branch.
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/waybionic/waybionic_ground_station

jobs:
  # Pull requests build and test with a read-only token. Keep these check names
  # stable for review.
  build-and-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Test with Docker Compose
        run: docker compose --progress plain build test

  build-and-test-arm64:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Test with Docker Compose
        run: docker compose --progress plain build test

  # Pushes to main build and test the same way, then push the tested image under this commit.
  publish-amd64:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # No registry cache: a published layer must come from this build, not from :jazzy.
      - name: Build and Test with Docker Compose
        run: docker compose --progress plain build --no-cache test

      - name: Log in to the GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push the tested x86-64 image
        id: push
        shell: bash
        run: |
          docker tag "$IMAGE:jazzy" "$IMAGE:$GITHUB_SHA-amd64"
          push_log=$(docker push "$IMAGE:$GITHUB_SHA-amd64")
          printf '%s\n' "$push_log"
          if [[ "$push_log" =~ digest:\ (sha256:[0-9a-f]{64}) ]]; then
            echo "digest=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::docker push did not report the tested image digest"
            exit 1
          fi

  publish-arm64:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Test with Docker Compose
        run: docker compose --progress plain build --no-cache test

      - name: Log in to the GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push the tested ARM64 image
        id: push
        shell: bash
        run: |
          docker tag "$IMAGE:jazzy" "$IMAGE:$GITHUB_SHA-arm64"
          push_log=$(docker push "$IMAGE:$GITHUB_SHA-arm64")
          printf '%s\n' "$push_log"
          if [[ "$push_log" =~ digest:\ (sha256:[0-9a-f]{64}) ]]; then
            echo "digest=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::docker push did not report the tested image digest"
            exit 1
          fi

  publish-image:
    if: github.event_name == 'push'
    needs: [publish-amd64, publish-arm64]
    runs-on: ubuntu-24.04
    # One run at a time moves the shared tag, after checking that its commit is still newest.
    concurrency:
      group: publish-image
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Log in to the GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish one image for both architectures
        shell: bash
        run: |
          amd64="${{ needs.publish-amd64.outputs.digest }}"
          arm64="${{ needs.publish-arm64.outputs.digest }}"
          if [[ ! "$amd64" =~ ^sha256:[0-9a-f]{64}$ || ! "$arm64" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Missing tested image digest"
            exit 1
          fi
          tags=(--tag "$IMAGE:${GITHUB_SHA::7}")
          # Runs can finish out of order: only the newest commit on main moves :jazzy.
          head=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
          if [ -z "$head" ]; then
            echo "::error::Could not resolve main before moving :jazzy"
            exit 1
          fi
          if [ "$head" = "$GITHUB_SHA" ]; then
            tags+=(--tag "$IMAGE:jazzy")
          else
            echo "main has moved on to $head, so :jazzy stays where it is"
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE@$amd64" "$IMAGE@$arm64"
