# Simulation-only normalized claw calibration. These numbers are NOT Biomedical
# measurements and must be replaced before describing physical travel or commands.
# The 320-microstep span is an arbitrary simulation stand-in. Biomedical's 200-step
# joystick sweep is not a measurement of claw travel or steps per claw degree.
xbox_teleop:
  ros__parameters:
    # Provisional normalized claw command and mesh geometry. Replace only these
    # values after Biomedical confirms travel, STL units and flange mounting.
    tool_limits: [0.0, 1.0]
    tool_speed: 0.25
    tool_mesh_scale_m_per_unit: 0.001
    tool_assembly_origin_m: [0.0, 0.0539, 0.01]
    tool_assembly_quaternion_xyzw: [0.0, 0.0, 0.0, 1.0]
    tool_claw_pivot_m: [0.0, -0.0539, 0.121306]
    tool_preview_open_angles_rad: [-0.35, 0.35]  # left, right; unmeasured
sim_tool_motors:
  ros__parameters:
    rate_hz: 120.0
    command_timeout_s: 0.5
    pair_tolerance: 0.05
    # Simulation-only fault injection: one motor name, or empty for no fault.
    simulated_stalled_motor: ''
    # Provisional host request ceilings; firmware itself caps at 60 rpm and
    # 20000 steps/s^2. These are not measured safe physical motion settings.
    board_safe_rpm: 60
    board_acceleration_code: 200
    # The F5 acceleration byte is not steps/s^2; see tool board firmware.
    claws: [left_claw, right_claw]
    left_claw:
      lower: 0.0
      upper: 1.0
      reference: 0.0
      max_speed: 0.25
      motors: [left_1, left_2]
    right_claw:
      lower: 0.0
      upper: 1.0
      reference: 0.0
      max_speed: 0.25
      motors: [right_1, right_2]
    # Direction signs are provisional and can change with winding and wiring.
    left_1:
      direction: 1
      steps_per_unit: 320.0
      reference_steps: 0
    left_2:
      direction: -1
      steps_per_unit: 320.0
      reference_steps: 0
    right_1:
      direction: 1
      steps_per_unit: 320.0
      reference_steps: 0
    right_2:
      direction: -1
      steps_per_unit: 320.0
      reference_steps: 0
