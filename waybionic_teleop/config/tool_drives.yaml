# Simulation-only normalized claw calibration. These numbers are NOT Biomedical
# measurements and must be replaced before describing physical travel or commands.
# The 320-microstep span is an arbitrary simulation stand-in. Biomedical's 200-step
# joystick sweep is not a measurement of claw travel or steps per claw degree.
sim_tool_motors:
  ros__parameters:
    rate_hz: 120.0
    pair_tolerance: 0.05
    claws: [left_claw, right_claw]
    left_claw:
      lower: 0.0
      upper: 1.0
      reference: 0.0
      max_speed: 0.25
      motors: [left_1, left_2]
    right_claw:
      lower: 0.0
      upper: 1.0
      reference: 0.0
      max_speed: 0.25
      motors: [right_1, right_2]
    # Direction signs are provisional and can change with winding and wiring.
    left_1:
      direction: 1
      steps_per_unit: 320.0
      reference_steps: 0
    left_2:
      direction: -1
      steps_per_unit: 320.0
      reference_steps: 0
    right_1:
      direction: 1
      steps_per_unit: 320.0
      reference_steps: 0
    right_2:
      direction: -1
      steps_per_unit: 320.0
      reference_steps: 0
