# Joint-to-drive map for the arm's MKS drives on CAN, simulated or real. gear_ratio is motor
# turns per output turn, from the CAD: 26:1 cycloidal reducers (26-pin output ring, 25-lobe
# disc) on the base, shoulder and elbow, and 20T-to-60T belts (3:1) on the two wrist motors.
# factors give each motor's output angle per joint angle: the 25T bevel differential turns both
# wrist motors together for pitch and oppositely for roll. If a drive turns the wrong way on
# the bench, negate its factors. The tool drive is a placeholder with no hardware behind it;
# the tool board's motors answer on CAN IDs 7 to 10 (firmware/tool_board/README.md).
sim_arm_drives:
  ros__parameters:
    rate_hz: 120.0
    # The drives ship at 500 kbit/s, and the carrier's MCP2515 module (8 MHz crystal) cannot run
    # 1 Mbit/s. Six drives at 120 Hz load the bus about 60%, the four now wired about 40%.
    bitrate: 500000
    # The carrier's USB serial speed (carrier_bridge.ino); only used with interface slcan.
    tty_baudrate: 1000000
    # Teleop ramps the speed. A steep drive ramp keeps the drives in step with each other: a
    # gentle one gives every drive the same rpm/s, so the one that must change most falls behind.
    acc: 255
    # The fastest teleop speed (60 deg/s) needs 260 rpm on a 26:1 joint; this leaves room for a
    # drive that fell behind to catch up.
    max_rpm: 600
    heartbeat_ms: 500
    # Without a new joint command for this long, every drive stops where it is and holds
    # there, whether or not the last command carried a speed.
    command_timeout_s: 0.5
    # Provisional until tuned on the arm: a drive more than this many encoder counts from its
    # target for this many ticks in a row has stopped following, so every drive stops and the
    # arm must be zeroed again. 4096 counts is a quarter motor turn: 3.5 degrees through a 26:1
    # reducer, 30 through the 3:1 wrist belts, and about seven ticks of motion at teleop's top
    # speed, whose setpoints run one tick ahead.
    following_error_counts: 4096
    following_error_ticks: 12
    # Provisional drive-health thresholds; tune them against real arm behavior.
    health_following_error_degrees: 5.0
    health_stall_movement_degrees: 1.0
    health_stall_duration_seconds: 2.0
    health_reply_timeout_seconds: 0.5
    # Teleop republishes its enable every tick; stop the drives if it goes quiet this long (the
    # same as xbox_teleop's input_timeout_s).
    enable_timeout_s: 0.5
    # The placeholder grip has no URDF joint yet; every modeled arm joint must have a limit.
    # Simulation only: on a real bus every drive joint needs a URDF limit.
    unmodeled_joints: [tool_grip]
    drives: [base_yaw, shoulder, elbow, wrist_left, wrist_right, tool]
    # On a real bus these drives are simulated in the host because they have no hardware yet: the
    # shoulder (J2) waits for its PCB, and the tool is a placeholder. J2 holds still at zero, so
    # put it in the zero pose before zeroing. Take a drive off this list once it is wired, and
    # delete the line when none is left (a parameter file cannot hold an empty list).
    simulated_drives: [shoulder, tool]
    # SERVO42D (NEMA17)
    base_yaw:
      can_id: 1
      gear_ratio: 26.0
      joints: [joint_1]
      factors: [1.0]
    # SERVO57D (NEMA23)
    shoulder:
      can_id: 2
      gear_ratio: 26.0
      joints: [joint_2]
      factors: [1.0]
    # SERVO42D
    elbow:
      can_id: 3
      gear_ratio: 26.0
      joints: [joint_3]
      factors: [1.0]
    # SERVO42D, left side gear: pitch minus roll
    wrist_left:
      can_id: 4
      gear_ratio: 3.0
      joints: [joint_4, joint_5]
      factors: [1.0, -1.0]
    # SERVO42D, right side gear: pitch plus roll
    wrist_right:
      can_id: 5
      gear_ratio: 3.0
      joints: [joint_4, joint_5]
      factors: [1.0, 1.0]
    tool:
      can_id: 6
      gear_ratio: 1.0
      joints: [tool_grip]
      factors: [1.0]
