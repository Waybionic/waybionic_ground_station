# Placeholder Xbox mapping for the simulated arm. Axis and button names follow the joy
# game_controller_node layout in waybionic_teleop/gamepad.py; joint limits come from the URDF.
xbox_teleop:
  ros__parameters:
    # Two updates per 60 Hz display frame keep motion in RViz free of judder.
    rate_hz: 120.0
    input_timeout_s: 0.5
    deadzone: 0.15
    max_speed_deg_s: 60.0
    max_accel_deg_s2: 480.0
    speed_levels: [0.1, 0.25, 0.5, 1.0]
    initial_speed_level: 2
    home_gain: 2.0
    enable_button: start
    stop_button: b
    # Quoted because ROS parameter files read a bare y as true.
    group_button: 'y'
    home_button: a
    faster_button: dpad_up
    slower_button: dpad_down
    lock_button: left_bumper
    tilt_up_button: dpad_right
    tilt_down_button: dpad_left
    groups: [base, upper, cartesian, incision]
    # Left stick right turns joint_1 positive (counter-clockwise seen from above), which is to
    # the right of an operator facing the arm. Right stick up lifts the elbow (joint_3 negative).
    base:
      joints: [joint_1, joint_2, joint_3]
      axes: [left_x, left_y, right_y]
      scales: [-1.0, 1.0, -1.0]
    # Left stick up lifts the elbow (joint_3 negative), as in the base group. Right stick up tips
    # the wrist up (joint_4 negative), and right turns the wrist roll positive (counter-clockwise
    # from above at the zero pose), as the operator preferred on the bench arm.
    upper:
      joints: [joint_2, joint_3, joint_4, joint_5]
      axes: [left_x, left_y, right_y, right_x]
      scales: [1.0, -1.0, -1.0, -1.0]
    # Straight tool-tip moves in base_link: forward (x), left (y), up (z), then tool roll. The
    # lock button keeps only the strongest of x, y and z; the tilt buttons pivot the tool about
    # its tip.
    cartesian:
      mode: cartesian
      joints: [joint_1, joint_2, joint_3, joint_4, joint_5]
      axes: [left_y, left_x, right_y, right_x]
      scales: [1.0, 1.0, 1.0, 1.0]
    # Keyhole moves through the incision point, which is where the tip was when this group was
    # selected: insert or withdraw along the tool axis, tilt about the incision point, and roll.
    # With five joints the tilt stays in the arm's vertical plane.
    incision:
      mode: incision
      joints: [joint_1, joint_2, joint_3, joint_4, joint_5]
      axes: [left_y, right_y, right_x]
      scales: [1.0, 1.0, 1.0]
    # Chicken head mode (the Chicken head panel in RViz): the tool tip goes to this spot in
    # base_link, 30 cm forward and 55 cm up with the tool pointing forward (90 degrees from straight
    # up), and stays there while the other joints move. The first stick tilts the tool about the
    # tip (up tilts it up) and the second rolls it. The tool can tilt through about 215 degrees at
    # this spot.
    chicken_head:
      position: [0.30, 0.0, 0.55]
      pitch_deg: 90.0
      axes: [left_y, right_x]
      scales: [1.0, 1.0]
    # Demo mode (the Motion modes panel in RViz): the arm moves around by itself, slowly and
    # smoothly, and the sticks do nothing. Each joint swings about the pose the arm is in when the
    # mode starts: it makes `cycles` whole swings of up to `amplitudes_deg` in every `loop_s`
    # seconds, starting `phases_deg` into its swing, so the arm does not repeat itself before
    # the loop is over. The swing grows over `ramp_s` seconds at the start and shrinks over as
    # long when the mode is switched off, which brings the arm back to where it started. A joint
    # stays `margin_deg` clear of its limits, and one with less room than `min_swing_deg` stays
    # still. No joint may go faster than `max_speed_deg_s`: settings that would are refused when
    # teleop starts. The speed level can slow the demo but never speeds it up.
    demo:
      joints: [joint_1, joint_2, joint_3, joint_4, joint_5]
      amplitudes_deg: [30.0, 15.0, 25.0, 20.0, 35.0]
      cycles: [3, 5, 4, 6, 2]
      phases_deg: [0.0, 140.0, 250.0, 70.0, 200.0]
      loop_s: 120.0
      ramp_s: 12.0
      margin_deg: 10.0
      min_swing_deg: 3.0
      max_speed_deg_s: 12.0
    max_linear_speed_mm_s: 50.0
    max_linear_accel_mm_s2: 250.0
    max_tilt_speed_deg_s: 30.0
    # Placeholder end effector until Biomedical defines the tool: 0 is open, 1 is closed.
    tool_joint: tool_grip
    tool_limits: [0.0, 1.0]
    tool_speed: 1.0
    tool_close_axis: right_trigger
    tool_open_axis: left_trigger
    tool_frame: tool_link
    base_frame: base_link
    # Moves stop before any link's collision box comes within collision_clearance (m) of the
    # table, table_height (m) above the bottom of the base, or of the base and shoulder.
    table_height: 0.0
    collision_clearance: 0.01
